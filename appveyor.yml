image:
  - Visual Studio 2022

clone_folder: c:\projects\source

environment:
  matrix:
    - PLATFORM: ARM64
      Qt6_INSTALL_DIR: 'C:\Qt\6.9\msvc2022_arm64'
      OPENSSL_PLATFORM: 'VC-WIN64-ARM'
    - PLATFORM: x64
      Qt6_INSTALL_DIR: 'C:\Qt\6.9\msvc2022_64'
      BUILD_OPENSSL: 'NO'

  PATH: '%Qt6_INSTALL_DIR%\bin;C:\Strawberry\perl\bin;%PATH%'

install:
- cmd: >-

    if /i "%PLATFORM%"=="ARM64" (
      echo Installing NASM for OpenSSL build...

      choco install nasm -y

      set PATH=C:\Program Files\NASM;%PATH%
    )

before_build:
- cmd: >-

    if /i "%PLATFORM%"=="ARM64" (
      echo Building OpenSSL for ARM64...
      
      echo Perl version:
      
      perl --version
      
      echo NASM version:
      
      nasm -v
      
      cd c:\projects
      
      git clone --depth 1 --branch openssl-3.0.15 https://github.com/openssl/openssl.git
      
      cd openssl
      
      call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsamd64_arm64.bat"
      
      perl Configure %OPENSSL_PLATFORM% --prefix=C:\OpenSSL-ARM64 --openssldir=C:\OpenSSL-ARM64\ssl no-tests
      
      nmake
      
      nmake install
      
      echo OpenSSL built and installed to C:\OpenSSL-ARM64
    ) else (
      echo Skipping OpenSSL build for x64, using pre-installed version
    )


build_script:
- cmd: >-

    if /i "%PLATFORM%"=="ARM64" (

    set QTDIR=%Qt6_INSTALL_DIR%

    set "VCINSTALLDIR=C:\Program Files (x86)\Microsoft Visual Studio\2022\Community\VC"

    if /i "%PLATFORM%"=="ARM64" (
      set "OPENSSL_ROOT_DIR=C:/OpenSSL-ARM64"
    ) else (
      set "OPENSSL_ROOT_DIR=C:/OpenSSL-v111-Win64"
    )

    rem Windows ARM64 cross-compile requires Qt host tools

    set CMAKE_EXTRA_ARGS=

    if /i "%PLATFORM%"=="ARM64" set CMAKE_EXTRA_ARGS=-DQT_HOST_PATH=C:\Qt\6.9\msvc2022_64 -DCMAKE_SYSTEM_PROCESSOR=aarch64

    if /i "%PLATFORM%"=="x64" set CMAKE_EXTRA_ARGS=-DCMAKE_SYSTEM_PROCESSOR=x86_64

    cmake -S c:\projects\source -B build -G "Visual Studio 17 2022" -A %PLATFORM% -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_OPENSSL=ON -DRUN_IN_PLACE=OFF %CMAKE_EXTRA_ARGS%

    cmake --build build --parallel 2 --config "Release"

    cd build 

    cpack -G WIX -B package

    mkdir artifact

    cp package/*.msi artifact\.

    cp src/Release/*.exe artifact\.

    7z a -tzip artifact_%PLATFORM%.zip artifact/

artifacts:
- path: build\package\*.msi
  name: installer_%PLATFORM%
- path: build\src\Release\*.exe
  name: executable_%PLATFORM%
- path: build\artifact_*.zip
  name: archive

deploy:
- provider: Webhook
  url: https://app.signpath.io/API/v1/042f605f-b378-45d8-ad16-b7695b071036/Integrations/AppVeyor?ProjectSlug=flameshot&SigningPolicySlug=test-signing
  authorization:
    secure: G5nNnkfRSJ+EEx+7LlUSSoEyoL+pHYItvjrNxbWITE7RB+cm9qzuHRdwmrZdEDjdVCLZ2TkNawynMxYcGMZAQA==
